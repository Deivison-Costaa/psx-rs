# Sem `if:` nos passos do job check, nunca: um passo pulado não mede nada e deixa o job
# verde. O meta-teste ci_workflow.rs (item 0.3) reprova o PR que reintroduzir condicional.
# A versão do compilador vem do rust-toolchain.toml e de nenhum outro lugar — este workflow
# não escolhe canal (toolchain_pin.rs reprova quem voltar a escolher).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: instala o compilador pinado no rust-toolchain.toml
        run: rustup toolchain install --no-self-update && cargo --version
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all

  scoreboard:
    name: scoreboard
    runs-on: ubuntu-latest
    needs: check
    if: success()
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: instala o compilador pinado
        run: rustup toolchain install --no-self-update && cargo --version
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev
      - name: baixa EXEs de teste
        run: pwsh scripts/fetch-test-exes.ps1
        continue-on-error: true
      - name: build psx-cli
        run: cargo build --release -p psx-cli
      - name: roda scoreboard
        run: pwsh scripts/scoreboard.ps1
      - name: publica placar na branch scoreboard-data
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git checkout scoreboard-data 2>/dev/null || git checkout --orphan scoreboard-data
          git rm -rf --cached . 2>/dev/null || true
          if [ -f scoreboard-data.csv ]; then
            tail -n +2 logs/scoreboard.csv >> scoreboard-data.csv
          else
            cp logs/scoreboard.csv scoreboard-data.csv
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scoreboard-data.csv
          git diff --staged --quiet || git commit -m "scoreboard: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin scoreboard-data
